<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
    <title>Thor Track</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f5f3ef; color: #252622; }
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; }
      .mark { font-size: 42px; color: #2c765b; }
      h1 { font-size: 28px; margin: 16px 0 6px; letter-spacing: -.04em; }
      p { font-size: 16px; color: #62655f; }
      @media (prefers-color-scheme: dark) { :root { background: #171b1e; color: #edf2ec; } p { color: #abb6ae; } .mark { color: #a9e5c5; } }
    </style>
  </head>
  <body><main role="status"><div class="mark" aria-hidden="true">↗</div><h1>Thor Track</h1><p>Opening your shipment watch…</p></main></body>
</html>
